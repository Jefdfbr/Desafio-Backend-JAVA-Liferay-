##
## Desafio2 — To-do-list Portlet
## Liferay 7.4.3 GA132 Community Edition
##

##
## Database — PostgreSQL (container alje-postgres-1, db desafio2)
##
jdbc.default.driverClassName=org.postgresql.Driver
jdbc.default.url=jdbc:postgresql://alje-postgres-1:5432/desafio2
jdbc.default.username=alje
jdbc.default.password=alje

##
## Server
##
web.server.http.port=8080
web.server.display.node=false
browser.launcher.url=

##
## Disable setup wizard
##
setup.wizard.enabled=false

##
## Company / Defaults
##
company.default.web.id=desafio2.alje.app
company.default.name=Desafio2
company.default.locale=pt_BR
company.default.timezone=America/Sao_Paulo

##
## Default Admin
##
default.admin.first.name=Admin
default.admin.last.name=Administrator
default.admin.email.address=test@desafio2.alje.app
default.admin.password=admin123
default.admin.screen.name=admin

##
## Security
##
passwords.default.policy.change.required=false
passwords.minimum.length=6
company.security.auth.type=emailAddress

##
## Session
##
session.timeout=120
session.timeout.auto.extend=true

##
## Reverse Proxy (nginx)
##
web.server.protocol=https
web.server.proxy.legacy.url=https://desafio2.alje.app
portal.proxy.path=
virtual.hosts.valid.hosts=desafio2.alje.app,localhost
redirect.url.ips.allowed=*
redirect.url.security.mode=domain

##
## Registration — skip email verification (no SMTP configured)
##
company.security.strangers.verify=false

##
## Password reset — disable security question, use email link only
##
users.reminder.queries.enabled=false
users.reminder.queries.required=false

##
## Upload limits
##
dl.file.max.size=5242880
upload.servlet.request.size.max=5242880
